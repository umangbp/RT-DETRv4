__include__: [
  '../dfine/dfine_hgnetv2_m_coco.yml',
  '../base/rtv4.yml',
  '../dataset/shelf_ticket_detection_v5.yml'
]

# ============================================================
# Shelf Ticket Detection - Bootstrap V5
# ============================================================

output_dir: ./outputs/rtv4_hgnetv2_m_shelf_ticket_bootstrap_v5


# ------------------------------------------------------------
# Dataset
# ------------------------------------------------------------

num_classes: 1
remap_mscoco_category: False


# ------------------------------------------------------------
# DINOv3 teacher
# ------------------------------------------------------------

teacher_model:
  type: "DINOv3TeacherModel"
  dinov3_repo_path: dinov3/
  dinov3_weights_path: pretrain/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
  patch_size: 16
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]


# ------------------------------------------------------------
# RT-DETRv4-M
# ------------------------------------------------------------

HybridEncoder:
  distill_teacher_dim: 768


# ------------------------------------------------------------
# Distillation
# ------------------------------------------------------------

RTv4Criterion:
  weight_dict:
    loss_distill: 5

  distill_adaptive_params:
    enabled: True
    rho: 3.5
    delta: 0.25
    default_weight: 15


# ------------------------------------------------------------
# Optimizer
# ------------------------------------------------------------

optimizer:
  type: AdamW

  params:
    -
      params: '^(?=.*backbone)(?!.*bn).*$'
      lr: 0.00004

    -
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  lr: 0.0004
  betas: [0.9, 0.999]
  weight_decay: 0.0001


# ------------------------------------------------------------
# Training schedule - Bootstrap V5
# ------------------------------------------------------------

epoches: 40

# Flat-cosine LR schedule
warmup_iter: 50
flat_epoch: 12
no_aug_epoch: 5


train_dataloader:
  total_batch_size: 8

  dataset:
    transforms:
      policy:
        # [strong aug starts, Mosaic ends, strong aug ends]
        epoch: [2, 12, 30]

  collate_fn:
    # MixUp active during epochs [2, 12)
    mixup_epochs: [2, 12]

    # Stage-2 transition / multi-scale stop
    stop_epoch: 30


val_dataloader:
  total_batch_size: 8
